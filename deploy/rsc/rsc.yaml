# Render with render.py; substitutions are JSON-quoted YAML scalars.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${RSC_PVC}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${RSC_STORAGE_CLASS}
  resources:
    requests:
      storage: ${RSC_STORAGE_CAPACITY}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rsc-config
data:
  .config.json: |
    {
      "server_address": "0.0.0.0:3002",
      "public_base_url": ${RSC_PUBLIC_BASE_URL},
      "active_store": ${RSC_ACTIVE_STORE},
      "connection_pool_max_connect": 20,
      "connection_pool_timeout": 60,
      "log_directory": null,
      "blob_eviction": {"tick_rate": 60, "ttl": 3600, "chunk_size": 16000, "file_chunk_size": 100},
      "job_eviction": {"ttl": {"tick_rate": 600, "ttl": 86400, "chunk_size": 16000}},
      "job_size_calculate": {"tick_rate": 60, "chunk_size": 100},
      "load_shed": {"tick_rate": 30, "target": 80.0, "min_runtime": 0.5}
    }
---
apiVersion: v1
kind: Service
metadata:
  name: rsc
spec:
  selector:
    app.kubernetes.io/name: rsc
  ports:
    - name: http
      port: 3002
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rsc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rsc
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: rsc
          image: ${RSC_IMAGE}
          command: [/usr/local/bin/rsc]
          workingDir: /work
          env:
            - name: WAKE_RSC_CONFIG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${RSC_SECRET}
                  key: database-url
          ports:
            - name: http
              containerPort: 3002
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /blob
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: cache
              mountPath: /var/lib/rsc
            - name: config
              mountPath: /work/.config.json
              subPath: .config.json
              readOnly: true
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: ${RSC_PVC}
        - name: config
          configMap:
            name: rsc-config
