<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wake dashboard</title>
  <style>
    :root{color-scheme:dark;--bg:#080d18;--panel:#101827;--panel2:#151f32;--line:#26334a;--text:#edf3fc;--muted:#8d9bb2;--accent:#58c4dc;--ok:#4ade80;--run:#facc15;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px ui-sans-serif,system-ui,sans-serif}button,input,select{font:inherit}header{height:64px;padding:0 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;background:#0b1220}h1{font-size:18px;margin:0;letter-spacing:.2px}.nav{display:flex;gap:4px}.nav button,.ghost{color:var(--muted);background:transparent;border:1px solid transparent;border-radius:7px;padding:7px 11px;cursor:pointer}.nav button.on,.nav button:hover,.ghost:hover{color:var(--text);background:var(--panel2);border-color:var(--line)}#headline{margin-left:auto;color:var(--muted)}.filters{padding:12px 24px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(200px,2fr) repeat(5,minmax(95px,1fr)) auto;gap:8px;position:sticky;top:0;z-index:3;background:rgba(8,13,24,.96)}input,select{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:9px 10px}.check{display:flex;align-items:center;gap:7px;color:var(--muted);white-space:nowrap;padding:0 5px}.check input{width:auto}.content{padding:20px 24px 40px;max-width:1600px;margin:auto}.metrics{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px}.metric,.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}.metric{padding:15px}.metric strong{display:block;font-size:23px;margin-bottom:4px}.metric span,.muted{color:var(--muted)}.bad{color:var(--bad)!important}.ok{color:var(--ok)!important}.run{color:var(--run)!important}.dashboard-grid{display:grid;grid-template-columns:minmax(420px,1.35fr) minmax(330px,1fr);gap:14px;margin-top:14px}.card{overflow:hidden}.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:0;padding:13px 15px;border-bottom:1px solid var(--line);color:var(--muted)}.card-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.card-head h2{border:0}.card-head select{margin-right:9px;padding:6px 8px}.stack{display:grid;gap:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.table td.num,.table th.num{text-align:right}.click{cursor:pointer}.click:hover{background:var(--panel2)}.label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:520px}.empty{color:var(--muted);padding:28px}.jobs-layout{display:grid;grid-template-columns:minmax(330px,38%) 1fr;gap:14px;height:calc(100vh - 154px)}.job-list,.detail{overflow:auto}.job{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}.job:hover,.job.on{background:var(--panel2)}.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.tiny{font-size:12px}.detail{padding:20px}.detail h2{font-size:19px;margin:0 0 5px}.detail h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:23px 0 8px}.box,pre{background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:12px}pre{white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;margin:0}.files{margin:0;padding-left:20px}.files li{padding:3px 0}code{color:#c6e7f0;word-break:break-word}.pill{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:2px 7px;color:var(--muted)}.noise-note{color:var(--run);font-size:12px;margin-top:8px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.error{color:var(--bad);padding:20px}@media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:2fr repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}.jobs-layout{grid-template-columns:1fr;height:auto}.job-list{max-height:45vh}.detail{min-height:50vh}}@media(max-width:620px){header{padding:0 14px}.filters,.content{padding-left:14px;padding-right:14px}.filters{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}#headline{display:none}}
  </style>
</head>
<body>
  <header><h1>Wake</h1><nav class="nav"><button id="nav-dashboard" class="on">Dashboard</button><button id="nav-jobs">Jobs</button></nav><span id="headline">Loading build history…</span></header>
  <div class="filters">
    <input id="q" placeholder="Search labels, commands, artifacts, or job IDs">
    <select id="state"><option value="all">Any status</option><option value="failed">Failed</option><option value="running">Running</option><option value="passed">Passed</option></select>
    <input id="command" placeholder="Command contains…">
    <input id="artifact" placeholder="Artifact path or kind…">
    <input id="runtime" type="number" min="0" step="0.1" placeholder="Min seconds">
    <input id="run" type="number" min="1" step="1" placeholder="Run ID">
    <input id="exclude" placeholder="Exclude command regex…" title="Hide jobs whose full command line matches this regular expression">
  </div>
  <main id="app" class="content"><div class="empty">Loading…</div></main>
  <script>
    const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let view='dashboard',selected=null,data=[],dashboard=null,timer;
    const status=j=>j.status===null?['running','run']:j.status===0?['passed','ok']:['failed','bad'];
    const fmt=n=>new Intl.NumberFormat().format(n||0),seconds=n=>`${Number(n||0).toFixed(n>=100?0:2)}s`;
    const bytes=n=>{n=Number(n||0);for(const u of ['B','KiB','MiB','GiB','TiB']){if(n<1024||u==='TiB')return `${n<10&&u!=='B'?n.toFixed(1):Math.round(n)} ${u}`;n/=1024}};
    function params(extra={}){const p=new URLSearchParams;for(const [key,id] of [['q','q'],['state','state'],['command','command'],['artifact','artifact'],['run','run'],['exclude','exclude']]){const v=$(`#${id}`).value.trim();if(v&&!(key==='state'&&v==='all'))p.set(key,v)}const runtime=$('#runtime').value;if(runtime)p.set('min_runtime',runtime);for(const [k,v] of Object.entries(extra))if(v!==undefined&&v!==null&&v!=='')p.set(k,v);return p}
    async function get(path,p){const r=await fetch(`${path}?${p}`),body=await r.json();if(!r.ok)throw Error(body.error||`${r.status} ${r.statusText}`);return body}
    async function load(){try{if(view==='dashboard'){dashboard=await get('/api/dashboard',params({group:$('#group')?.value||'command'}));renderDashboard()}else{data=await get('/api/jobs',params({limit:1000}));renderJobs()}updateNav()}catch(e){$('#app').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
    function updateNav(){$('#nav-dashboard').classList.toggle('on',view==='dashboard');$('#nav-jobs').classList.toggle('on',view==='jobs')}
    function metric(value,label,css=''){return `<div class="metric"><strong class="${css}">${esc(value)}</strong><span>${esc(label)}</span></div>`}
    function renderDashboard(){const d=dashboard,m=d.metrics;$('#headline').textContent=`${fmt(m.jobs)} actionable jobs · ${fmt(m.hidden_noise)} noise hidden`;const groups=d.groups.map(g=>`<tr class="click" data-group="${esc(g.key)}"><td class="label">${esc(g.key)}</td><td class="num">${fmt(g.jobs)}</td><td class="num ${g.failed?'bad':''}">${fmt(g.failed)}</td><td class="num">${seconds(g.runtime)}</td><td class="num">${fmt(g.artifacts)}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">No matching groups.</td></tr>`;const failures=d.failures.map(j=>{const [text,css]=status(j);return `<tr class="click job-link" data-id="${j.job}"><td>#${j.job}</td><td class="label">${esc(j.label||'(unlabelled)')}</td><td class="${css}">${text}</td><td class="num">${seconds(j.runtime)}</td></tr>`}).join('')||`<tr><td colspan="4" class="empty">No failures in this view.</td></tr>`;const fanouts=d.fanouts.map(f=>`<tr class="click job-link" data-id="${f.producer_job}"><td class="label"><code>${esc(f.artifact)}</code><div class="muted tiny">from #${f.producer_job} ${esc(f.producer_label)}</div></td><td class="num">${fmt(f.consumers.length)}</td></tr>`).join('')||`<tr><td colspan="2" class="empty">No downstream artifact use recorded.</td></tr>`;$('#app').innerHTML=`<div class="metrics">${metric(fmt(m.failed),'failed jobs','bad')}${metric(fmt(m.running),'running jobs','run')}${metric(seconds(m.total_runtime),'wall runtime')}${metric(seconds(m.total_cputime),'CPU time')}${metric(bytes(m.io_bytes),'total I/O')}${metric(bytes(m.peak_memory_bytes),'peak memory')}</div><div class="dashboard-grid"><div class="card"><div class="card-head"><h2>Job groups</h2><select id="group"><option value="command">by command</option><option value="label">by label</option><option value="status">by status</option><option value="artifact">by artifact kind</option><option value="run">by run</option></select></div><table class="table"><thead><tr><th>Group</th><th class="num">Jobs</th><th class="num">Failed</th><th class="num">Runtime</th><th class="num">Artifacts</th></tr></thead><tbody>${groups}</tbody></table></div><div class="stack"><div class="card"><h2>Triage queue · newest failures</h2><table class="table"><tbody>${failures}</tbody></table></div><div class="card"><h2>High-fanout artifacts · ${fmt(m.fanout_edges)} edges</h2><table class="table"><tbody>${fanouts}</tbody></table></div></div></div>`;$('#group').value=d.group_by;$('#group').onchange=load;document.querySelectorAll('.job-link').forEach(e=>e.onclick=()=>showJob(+e.dataset.id));document.querySelectorAll('[data-group]').forEach(e=>e.onclick=()=>applyGroup(d.group_by,e.dataset.group))}
    function applyGroup(kind,key){if(kind==='command')$('#command').value=key;else if(kind==='label')$('#q').value=key;else if(kind==='status')$('#state').value=key;else if(kind==='artifact')$('#artifact').value=key;else if(kind==='run'){const id=key.match(/\d+/)?.[0];if(id)$('#run').value=id}else return;view='jobs';load()}
    function renderJobs(){$('#headline').textContent=`${fmt(data.length)} matching jobs`;const list=data.map(j=>{const [text,css]=status(j);return `<div class="job ${selected===j.job?'on':''}" data-id="${j.job}"><div class="row"><b class="label">${esc(j.label||'(unlabelled)')}</b><span class="${css}">${text}</span></div><div class="row muted tiny"><span>#${j.job} · ${(j.commandline||[]).length?esc((j.commandline[0]||'').split('/').pop()):'internal'} · ${seconds(j.runtime)}</span><span>${j.artifacts.length} outputs</span></div>${j.noise?`<div class="noise-note">noise: ${esc(j.noise)}</div>`:''}</div>`}).join('')||'<div class="empty">No jobs match the current filters.</div>';$('#app').innerHTML=`<div class="jobs-layout"><div class="card job-list">${list}</div><div id="detail" class="card detail"><div class="empty">Select a job to trace its command, artifacts, logs, and downstream consumers.</div></div></div>`;document.querySelectorAll('.job').forEach(e=>e.onclick=()=>showJob(+e.dataset.id));if(selected)showJob(selected,false)}
    async function showJob(id,switchView=true){selected=id;if(switchView&&view!=='jobs'){view='jobs';data=await get('/api/jobs',params({limit:1000}));renderJobs();updateNav();return}document.querySelectorAll('.job').forEach(e=>e.classList.toggle('on',+e.dataset.id===id));location.hash=`job-${id}`;const r=await fetch(`/api/jobs/${id}`),j=await r.json();if(!r.ok){$('#detail').innerHTML=`<div class="error">${esc(j.error||r.statusText)}</div>`;return}const files=(items,empty)=>items.length?`<ul class="files">${items.map(f=>`<li><code>${esc(f.path)}</code> <span class="muted">${esc(f.kind)}</span></li>`).join('')}</ul>`:`<span class="muted">${empty}</span>`;const downstream=(j.fanouts||[]).length?`<ul class="files">${j.fanouts.map(f=>`<li><a class="job-link" data-id="${f.job}">#${f.job} ${esc(f.label||'(unlabelled)')}</a> <span class="muted">← ${esc(f.artifact)}</span></li>`).join('')}</ul>`:'<span class="muted">No recorded consumers</span>';$('#detail').innerHTML=`<h2>${esc(j.label||'(unlabelled)')}</h2><div class="muted">Job #${j.job} · original run #${j.run} · ${j.status===null?'in flight':j.status===0?'passed':`failed (exit ${j.status})`} · ${seconds(j.runtime)} wall · ${seconds(j.cputime)} CPU · ${bytes(j.membytes)} peak</div>${j.noise?`<div class="noise-note">Classified as ${esc(j.noise)}</div>`:''}<h3>Command</h3><div class="box"><code>${esc((j.commandline||[]).join(' '))}</code></div><div class="split"><div><h3>Output artifacts (${j.artifacts.length})</h3><div class="box">${files(j.artifacts,'No recorded outputs')}</div></div><div><h3>Input artifacts (${(j.inputs||[]).length})</h3><div class="box">${files(j.inputs||[],'No recorded inputs')}</div></div></div><h3>Downstream consumers (${(j.fanouts||[]).length})</h3><div class="box">${downstream}</div><h3>Standard output</h3><pre>${esc(j.stdout)||'<span class="muted">Empty</span>'}</pre><h3>Standard error</h3><pre>${esc(j.stderr)||'<span class="muted">Empty</span>'}</pre>`;document.querySelectorAll('#detail .job-link').forEach(e=>e.onclick=()=>showJob(+e.dataset.id))}
    function setView(next){view=next;selected=next==='dashboard'?null:selected;load()}
    $('#nav-dashboard').onclick=()=>setView('dashboard');$('#nav-jobs').onclick=()=>setView('jobs');document.querySelectorAll('.filters input,.filters select').forEach(e=>{e.oninput=()=>{clearTimeout(timer);timer=setTimeout(load,180)};e.onchange=load});const deep=location.hash.match(/^#job-(\d+)$/);if(deep){view='jobs';selected=+deep[1]}load();setInterval(()=>{if(!document.hidden)load()},5000);
  </script>
</body>
</html>
