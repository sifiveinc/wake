[package]
name = "wake-tools"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[features]
default = []
web = ["dep:axum", "dep:tokio"]
tui = ["dep:crossterm", "dep:ratatui"]

[lib]
name = "wake_tools"
path = "src/lib.rs"

[[bin]]
name = "wake-tools"
path = "src/bin/wake-tools.rs"
required-features = ["web", "tui"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", optional = true }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", optional = true }
ratatui = { version = "0.29", optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "signal"], optional = true }
